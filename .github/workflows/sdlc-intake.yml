# Agent 1 — Intake. Pure script: classify, dedupe, risk-score, open the ledger.
name: sdlc-intake

on:
  issues:
    types: [opened, reopened]
  # An issue created by an agent does NOT fire `issues.opened` — GitHub refuses to trigger a
  # workflow from a GITHUB_TOKEN event. The maintainer splits an epic into six issues and
  # every one of them lands in a void unless something dispatches intake explicitly.
  workflow_dispatch:
    inputs:
      issue: { required: true, type: string }

concurrency:
  group: sdlc-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false      # never cancel a state write mid-flight

permissions:
  contents: write                # writes the ledger on the sdlc-state branch
  issues: write
  actions: write          # required to dispatch the next stage with `gh workflow run`

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Only cache when there is a lockfile. Without this, setup-node fails outright on a
          # zero-dependency project or any non-Node repo, before a single step has run.
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}

      - name: Kill switch
        run: node .sdlc/bin/sdlc-ctl.mjs guard

      # Works in a repo with no package.json: install the repo's own deps when there is a
      # manifest, then make sure the framework's single dependency is available either way.
      - name: Bootstrap
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi
          node .sdlc/bin/ensure-deps.mjs

      - name: Open the ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .sdlc/bin/sdlc-ctl.mjs init --issue ${{ github.event.issue.number || inputs.issue }}

      - name: Triage
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ASSOCIATION: ${{ github.event.issue.author_association }}
        run: node .sdlc/bin/intake.mjs

      # Explicit hand-off. The label alone would not start the planner — see the note in
      # sdlc-plan.yml about GITHUB_TOKEN not triggering workflows.
      # An epic goes to the maintainer to be split; everything else to the planner. Decided
      # here so nothing downstream spends an attempt discovering the issue is too big.
      - name: Hand off
        if: steps.triage.outputs.next_state == 'planning'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ "${{ steps.triage.outputs.agent }}" = "maintainer" ]; then
            node .sdlc/bin/dispatch.mjs sdlc-maintainer.yml -f epic="$ISSUE"
          else
            node .sdlc/bin/dispatch.mjs sdlc-plan.yml -f issue="$ISSUE"
          fi
