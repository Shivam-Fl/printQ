<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · PrintQs</title>
    <!-- Served by Vercel for paths the SPA rewrite skips (a dot in the last segment, e.g. /s/qa.test) (PA-8). -->
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #172033; font-family: system-ui, sans-serif; }
      main { max-width: 420px; padding: 24px 16px; text-align: center; line-height: 1.5; }
      .code { display: block; font-size: 3rem; font-weight: 800; color: #3659e3; letter-spacing: 0.04em; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #667085; margin: 0 0 20px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 12px; font-size: 1rem; font-weight: 600; text-decoration: none; }
      a.primary { background: #3659e3; color: #fff; }
      a.secondary { border: 1.5px solid #3659e3; color: #3659e3; }
    </style>
  </head>
  <body>
    <main>
      <span class="code" aria-hidden="true">404</span>
      <h1>This page is not in the queue</h1>
      <p>The link may be old or mistyped. Head back to PrintQs and pick up from there.</p>
      <div class="actions">
        <a class="btn primary" href="/">Go to Home</a>
        <a class="btn secondary" href="/shops">Find a shop</a>
      </div>
    </main>
  </body>
</html>
