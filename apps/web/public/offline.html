<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>You are offline · PrintQs</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #172033; font-family: system-ui, sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; line-height: 1.5; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #667085; margin: 0 0 20px; }
      button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #3659e3; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>PrintQs needs a connection to load your prints and shops. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
