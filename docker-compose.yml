# Dev infrastructure only. App processes run on the host (npm run dev:*).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: printq
      POSTGRES_PASSWORD: printq_dev_only
      POSTGRES_DB: printq
    ports:
      # host 15432 — 5432/5433 are taken by locally installed PostgreSQL services
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # host 6380 — 6379 is commonly taken by other local projects
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: S3-compatible storage for testing the s3 driver locally.
  # Dev default is STORAGE_DRIVER=local (plain disk), so this can stay off:
  #   docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: printq
      MINIO_ROOT_PASSWORD: printq_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
