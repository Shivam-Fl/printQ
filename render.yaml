# Render Blueprint — see DEPLOY.md for the full setup walkthrough.
#
# One combined web service runs the API + built web app + BullMQ workers in one
# process (pilot mode, same as `npm run dev:api` locally) — see apps/api/src/server.ts.
# The combined API/worker process remains a limited free-tier pilot runtime, but
# uploaded documents must use private durable storage. The production GCS bucket
# and Render secret file are provisioned out of band; never commit the key JSON.
# Splitting API/conversion workers is still required before unrestricted launch.

databases:
  - name: printq-db
    plan: free
    postgresMajorVersion: "16"

services:
  - name: printq-redis
    type: keyvalue
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere (tighten once you're off the free plan)

  - name: printq-web
    type: web
    runtime: docker
    plan: free
    # Promote only a CI- and development-QA-verified SHA with
    # `render deploys create <service-id> --commit <sha> --wait`.
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # preDeployCommand needs a paid plan — on free tier, migrations run instead
    # via the image's own CMD (docker-entrypoint.sh: migrate deploy, then start
    # the server). No dockerCommand override here — Render's dockerCommand
    # string isn't reliably shell-parsed (a quoted `&&` chain got passed
    # through as one literal token in testing), so the fix lives in the image.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRINTQ_ENVIRONMENT
        value: production
      - key: RUN_WORKERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: printq-db
          property: connectionString
      # Existing dedicated production database name, verified from Render.
      # Do not point this deployment at development or a replacement database.
      - key: DATABASE_NAMESPACE
        value: printq_db_f68p
      - key: REDIS_URL
        fromService:
          name: printq-redis
          type: keyvalue
          property: connectionString

      # Public origins are kept in the Blueprint so future auto-deploys cannot
      # silently break the split Vercel frontend / Render API connection.
      - key: CORS_ORIGINS
        value: https://printqs.com,https://www.printqs.com,https://printq-three.vercel.app,https://printq-web-lawc.onrender.com,https://api.printqs.com
      - key: PUBLIC_WEB_URL
        value: https://printqs.com

      # Firebase handles the student's phone OTP. Firebase web API keys are
      # public client identifiers (the browser bundle contains the same key),
      # so pin the dedicated PrintQs project here to prevent a future Blueprint
      # sync from ever falling back to Packkar.
      - key: STUDENT_AUTH_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        value: printqs-production
      - key: FIREBASE_AUTH_API_KEY
        # Environment-specific public Firebase configuration belongs in the
        # platform environment, never in the repository or a Blueprint sync.
        sync: false
      # Retired student checkout configuration. Pay-at-shop has no provider
      # checkout; keep this mock so the legacy Render service cannot move money.
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PLATFORM_MARKUP_BPS
        value: "2500"
      - key: SHOP_PAYOUT_PROVIDER
        value: mock
      - key: MIN_SHOP_PAYOUT_PAISE
        value: "50000"
      - key: MAX_SHOP_CASH_DEBT_PAISE
        value: "50000"
      - key: VAPID_PUBLIC_KEY
        sync: false # npx web-push generate-vapid-keys
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:you@example.com

      # --- auto-generated secrets: Render creates these for you, no action needed ---
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true

      # --- communications ---
      - key: SMS_PROVIDER
        value: console
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: PrintQs <support@mail.printqs.com>
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD_HASH
        sync: false

      # --- private production storage ---
      - key: STORAGE_DRIVER
        value: gcs
      - key: GCS_BUCKET
        value: printqs-production-private
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-production-service-account.json
      - key: SOFFICE_PATH
        value: /usr/bin/soffice
      - key: LOG_LEVEL
        value: info
