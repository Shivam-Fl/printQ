# Render Blueprint — see DEPLOY.md for the full setup walkthrough.
#
# The paid pilot keeps the existing combined API/workers service until conversion
# is split out and verified. Do not accept real document uploads with local
# ephemeral storage: configure private object storage and pass retention QA first.

databases:
  - name: printq-db
    plan: 0.5c-1g
    postgresMajorVersion: "16"

services:
  - name: printq-redis
    type: keyvalue
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - name: printq-web
    type: web
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations still run via docker-entrypoint.sh. Confirm deploy rollback and
    # migration compatibility before splitting workers or changing storage.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: printq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: printq-redis
          type: keyvalue
          property: connectionString

      # Public origins are kept in the Blueprint so future auto-deploys cannot
      # silently break the split Vercel frontend / Render API connection.
      - key: CORS_ORIGINS
        value: https://printqs.com,https://www.printqs.com,https://printq-three.vercel.app,https://printq-web-lawc.onrender.com,https://api.printqs.com
      - key: PUBLIC_WEB_URL
        value: https://printqs.com

      # Firebase handles the student's phone OTP. Firebase web API keys are
      # public client identifiers (the browser bundle contains the same key),
      # so pin the dedicated PrintQs project here to prevent a future Blueprint
      # sync from ever falling back to Packkar.
      - key: STUDENT_AUTH_PROVIDER
        value: firebase
      - key: FIREBASE_AUTH_API_KEY
        # Environment-specific public Firebase configuration belongs in the
        # platform environment, never in the repository or a Blueprint sync.
        sync: false
      # Retired student checkout configuration. Pay-at-shop has no provider
      # checkout; keep this mock so the legacy Render service cannot move money.
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PLATFORM_MARKUP_BPS
        value: "2500"
      - key: SHOP_PAYOUT_PROVIDER
        value: mock
      - key: MIN_SHOP_PAYOUT_PAISE
        value: "50000"
      - key: MAX_SHOP_CASH_DEBT_PAISE
        value: "50000"
      - key: VAPID_PUBLIC_KEY
        sync: false # npx web-push generate-vapid-keys
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:you@example.com

      # --- auto-generated secrets: Render creates these for you, no action needed ---
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true

      # --- soft-launch defaults: flip these once you have real MSG91/Resend accounts ---
      - key: SMS_PROVIDER
        value: console
      - key: EMAIL_PROVIDER
        value: console

      # --- storage: local disk for the free-tier testing week (ephemeral — see DEPLOY.md) ---
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./storage
      - key: SOFFICE_PATH
        value: /usr/bin/soffice
      - key: LOG_LEVEL
        value: info
